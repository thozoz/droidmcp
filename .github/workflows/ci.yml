name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Vet
        working-directory: daemon
        run: |
          go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Test
        working-directory: daemon
        run: go test -race ./...

  apk:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe stamps the version into the binaries
      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Build APK (daemon + bridges + app)
        run: sh scripts/build-apk.sh debug
      - uses: actions/upload-artifact@v7
        with:
          name: droidmcp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
